name: DartCore
description: Dart Scorer
publish_to: "none"
version: 0.1.1+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0+2
  image: ^4.2.0
  path_provider: ^2.1.5
  speech_to_text: ^7.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/default_computer_players.json
    - assets/data/bundled_theoretical_average_cache.json
    - assets/data/checkout_routes_v1.json
    - assets/templates/basic_pdc_template.json
